<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LingPALS — Unfold the Brochure</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
  :root{
    /* LingPALS brand: royal blue + gold, on a warm paper desk */
    --desk-1:#e8d3af; --desk-2:#c99f6d; --desk-3:#8a5a34;
    --ink:#12224a;
    --accent:#f5b400;          /* LingPALS gold */
    --accent-ink:#0b2a6b;
    --paper:#0f3aa0;           /* the leaflet is deep blue */
    --paper-edge:#0a2straße;
    --focus:#0a58ca;
    --paper-shadow: 0 26px 55px rgba(10,25,70,.5);
  }
  :root{ --paper-edge:#0a2870; } /* corrected edge colour */

  *{ box-sizing:border-box; }
  html,body{ height:100%; }

  body{
    margin:0;
    min-height:100dvh;
    font-family:"Segoe UI", system-ui, sans-serif;
    color:var(--ink);
    display:flex; flex-direction:column; align-items:center;
    overflow-x:hidden;
    background:
      radial-gradient(120% 90% at 50% -10%, rgba(255,251,240,.85), rgba(255,251,240,0) 55%),
      radial-gradient(80% 60% at 50% 120%, rgba(70,40,16,.35), rgba(70,40,16,0) 60%),
      repeating-linear-gradient(92deg, rgba(120,80,40,.05) 0 3px, rgba(120,80,40,0) 3px 7px),
      linear-gradient(160deg, var(--desk-1), var(--desk-2) 55%, var(--desk-3));
    background-attachment:fixed;
  }

  header{ text-align:center; padding:clamp(16px,4vw,30px) 18px 4px; max-width:820px; }
  header h1{ margin:0; font-size:clamp(1.5rem,3.6vw,2.3rem); font-weight:700; letter-spacing:.3px; }
  header p{ margin:8px 0 0; color:#5a4327; font-size:.95rem; }

  /* ---------- STAGE ---------- */
  .stage{
    flex:1 1 auto; width:100%;
    min-height:clamp(280px, 48dvh, 620px);
    display:flex; align-items:center; justify-content:center;
    padding:clamp(6px,2vw,16px);
    overflow:hidden;
  }
  .brochure-scaler{
    perspective:2400px; transform-origin:center center;
    transition:transform .5s ease; will-change:transform;
  }
  .brochure{
    position:relative; transform-style:preserve-3d;
    transition:transform .8s cubic-bezier(.62,.04,.3,1);
  }
  .brochure::before{
    content:""; position:absolute; left:-40%; right:-40%; bottom:-14%;
    height:40px; transform:translateZ(-80px); filter:blur(6px); pointer-events:none;
    background:radial-gradient(closest-side, rgba(10,25,70,.5), rgba(10,25,70,0));
  }

  .panel{
    position:absolute; top:0; transform-style:preserve-3d;
    transition:transform .8s cubic-bezier(.62,.04,.3,1);
  }
  .panel.center{ left:0; }
  .panel.left  { right:100%; transform-origin:right center; }
  .panel.right { left:100%;  transform-origin:left center; }

  .face{
    position:absolute; inset:0; backface-visibility:hidden; overflow:hidden;
    background:var(--paper); box-shadow:var(--paper-shadow);
    border:1px solid var(--paper-edge);
  }
  .face.back{ transform:rotateY(180deg); }
  .face canvas{ display:block; width:100%; height:100%; }

  .face::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(90deg,
      rgba(0,0,0,.16), rgba(0,0,0,0) 10%,
      rgba(0,0,0,0) 90%, rgba(0,0,0,.16));
  }

  .brochure.is-closed .panel.center .face.front{ cursor:pointer; }
  .cover-cue{
    position:absolute; left:50%; bottom:14px; transform:translateX(-50%);
    background:var(--accent); color:var(--accent-ink);
    font-size:.72rem; font-weight:700; letter-spacing:.4px;
    padding:6px 12px; border-radius:999px; pointer-events:none;
    opacity:0; transition:opacity .4s ease; z-index:5;
  }
  .brochure.is-closed .cover-cue{ opacity:1; animation:bob 2.2s ease-in-out infinite; }
  @keyframes bob{ 50%{ transform:translateX(-50%) translateY(-4px);} }

  /* ---------- HOTSPOTS ---------- */
  .hotspot{
    position:absolute; width:30px; height:30px; margin:-15px 0 0 -15px;
    border-radius:50%; border:none; background:var(--accent); color:var(--accent-ink);
    font-weight:700; cursor:pointer; box-shadow:0 4px 12px rgba(10,25,70,.5);
    opacity:0; pointer-events:none; transition:opacity .4s ease, transform .2s ease; z-index:6;
  }
  .brochure.is-open .hotspot{ opacity:1; pointer-events:auto; }
  .hotspot::before{
    content:""; position:absolute; inset:-6px; border-radius:50%;
    border:2px solid var(--accent); animation:pulse 2s ease-out infinite;
  }
  @keyframes pulse{ to{ transform:scale(1.9); opacity:0; } }
  .hotspot:hover, .hotspot:focus-visible{ transform:scale(1.15); }
  .hotspot .tip{
    position:absolute; left:50%; bottom:140%;
    transform:translateX(-50%) scale(.9); transform-origin:bottom center;
    width:190px; background:#fffdf8; color:var(--ink);
    border:1px solid #e7ddca; border-radius:10px; padding:9px 11px;
    font-size:.75rem; line-height:1.4; font-weight:500;
    box-shadow:0 10px 24px rgba(10,25,70,.4);
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
  }
  .hotspot[aria-expanded="true"] .tip{ opacity:1; transform:translateX(-50%) scale(1); }

  /* ---------- CONTROLS ---------- */
  .controls{
    width:min(720px, 94vw);
    background:rgba(255,253,248,.85);
    border:1px solid rgba(10,25,70,.14);
    backdrop-filter:blur(6px);
    border-radius:18px; padding:16px 20px; margin:8px 0 30px;
    display:grid; gap:14px; box-shadow:0 12px 30px rgba(58,36,15,.22);
  }
  .row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center; }

  button, .filebtn{
    font-family:inherit; background:var(--accent); color:var(--accent-ink);
    border:2px solid transparent; font-weight:700; padding:11px 18px;
    border-radius:12px; cursor:pointer; font-size:.9rem;
    transition:transform .1s, filter .15s;
  }
  button:hover, .filebtn:hover{ filter:brightness(1.06); }
  button:active{ transform:translateY(1px); }
  button[disabled]{ opacity:.4; cursor:not-allowed; }
  .ghost{ background:transparent; color:#12224a; border:2px solid rgba(10,25,70,.3); }

  .progress{ display:flex; gap:10px; align-items:center; }
  .dot{
    width:34px; height:10px; border-radius:999px; border:none; padding:0; cursor:pointer;
    background:rgba(10,25,70,.2); transition:background .3s ease, transform .2s ease;
  }
  .dot[aria-current="true"]{ background:var(--accent); transform:scaleY(1.3); }

  .filebtn input{ display:none; }
  .status{ font-size:.82rem; color:#12224a; text-align:center; min-height:1em; }

  a:focus-visible, button:focus-visible, .filebtn:focus-visible,
  .hotspot:focus-visible, .stage:focus-visible{
    outline:3px solid var(--focus); outline-offset:2px; border-radius:8px;
  }
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

  @media (pointer:coarse){
    button, .filebtn{ padding:13px 18px; }
    .hotspot{ width:38px; height:38px; margin:-19px 0 0 -19px; }
  }
  @media (max-width:560px){
    header p{ font-size:.86rem; }
    .controls{ padding:14px; gap:12px; margin-bottom:20px; }
    #unfoldBtn, #foldBtn, #resetBtn, .filebtn{ flex:1 1 44%; text-align:center; }
    .progress{ order:-1; width:100%; justify-content:center; }
    .dot{ width:44px; height:12px; }
  }
  @media (max-height:520px) and (orientation:landscape){
    header{ padding:8px 18px 0; } header p{ display:none; }
    .stage{ min-height:60dvh; } .controls{ margin:4px 0 12px; }
  }
  @media (max-width:700px){ .brochure-scaler{ perspective:1500px; } }

  @media (prefers-reduced-motion: reduce){
    .brochure, .panel, .brochure-scaler{ transition-duration:.001ms !important; }
    .hotspot::before, .brochure.is-closed .cover-cue{ animation:none !important; }
  }
</style>
</head>
<body>

<header>
  <h1>LingPALS — Unfold the Brochure</h1>
  <p>Peer support sessions for pre-honours Linguistics &amp; English Language students. Tap the cover — or use the buttons — to open each fold and see inside.</p>
</header>

<main class="stage" id="stage" tabindex="0"
      aria-label="Interactive LingPALS z-fold brochure. Use the Unfold and Fold buttons, or arrow keys, to open and close it.">
  <div class="brochure-scaler" id="scaler">
    <div class="brochure is-closed" id="brochure">

      <span class="cover-cue" aria-hidden="true">Tap to open ›</span>

      <div class="panel left" id="panelLeft">
        <div class="face front"><canvas></canvas></div>
        <div class="face back"><canvas></canvas></div>
      </div>
      <div class="panel center" id="panelCenter">
        <div class="face front"><canvas></canvas></div>
        <div class="face back"><canvas></canvas></div>
      </div>
      <div class="panel right" id="panelRight">
        <div class="face front"><canvas></canvas></div>
        <div class="face back"><canvas></canvas></div>
      </div>

    </div>
  </div>
</main>

<div class="controls">
  <div class="row">
    <button id="foldBtn" class="ghost" aria-label="Fold one panel back">‹ Fold</button>
    <div class="progress" role="group" aria-label="Unfolding progress">
      <button class="dot" data-stage="0" aria-label="Front cover" aria-current="true"></button>
      <button class="dot" data-stage="1" aria-label="Half open"></button>
      <button class="dot" data-stage="2" aria-label="Inside spread"></button>
    </div>
    <button id="unfoldBtn" aria-label="Unfold one panel">Unfold ›</button>
  </div>
  <div class="row">
    <button id="resetBtn" class="ghost">Start again</button>
    <label class="filebtn">Load another PDF
      <input type="file" id="file" accept="application/pdf">
    </label>
  </div>
  <p class="status" id="status" role="status" aria-live="polite">Loading LingPALS brochure…</p>
</div>

<script>
/* ============================================================
   PDF.js worker
   ============================================================ */
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

/* ------------------------------------------------------------
   CONFIG
   ------------------------------------------------------------ */
const PDF_URL        = "assets/brochure.pdf";
const DISPLAY_HEIGHT = 460;
const RENDER_SCALE   = 2;

/* Which page is which. If your PDF has the pages the other way
   round, just swap these two numbers.
   OUTSIDE = the "Stay Tuned / LingPALS cover" sheet.
   INSIDE  = the "Come along / Why attend / How to sign up" sheet. */
const OUTSIDE_PAGE = 1;
const INSIDE_PAGE  = 2;

/* Which third of the OUTSIDE page is the front cover.
   In the LingPALS artwork the cover ("LingPALS [lɪŋpʰaɫz]") is the
   RIGHT-hand third, so COVER_THIRD = 2. That third is shown on the
   centre panel when the brochure is closed.                        */
const COVER_THIRD = 2;

/* Unfolding stages.
   wing  = fold angle of each side panel (deg)
   spin  = whole-piece rotation (0 = exterior faces you, 180 = interior)
   tilt  = gentle 3D tilt (rotateX)
   depth = how far the folded wings are pushed BEHIND the cover (px)
           -> this is the fix for the "bleed-through" bug            */
const STAGES = [
  { wing:170, spin:0,   tilt:-12, depth:12, label:"Front cover — LingPALS peer support" },
  { wing:82,  spin:90,  tilt:-6,  depth:5,  label:"Half open — turning the page" },
  { wing:0,   spin:180, tilt:0,   depth:0,  label:"Inside — sessions, benefits & how to sign up" }
];

/* Real LingPALS hotspots on the INTERIOR (page 2).
   Interior thirds:  left = "Come along every Thursday",
                     centre = "Why attend?",  right = "How to sign up". */
const HOTSPOTS = [
  { panel:"left",   x:52, y:30, label:"When & where",
    text:"First session Thu 24 Sept — meet the team & Q&A. Then every Thursday 4:10–5:00pm, Teaching Room 13, Medical School, Teviot Pl EH8 9AG (enter via Doorway 3)." },
  { panel:"center", x:50, y:34, label:"Why attend",
    text:"Weekly peer-support led by trained student volunteers, based on what's coming up in your course. No prep needed — make friends, consolidate learning and get tips from peers." },
  { panel:"right",  x:46, y:40, label:"Am I eligible?",
    text:"Taking LEL1A, LEL2A or LEL2B? You're already on the LingPALS mailing list. No commitment — come once, come weekly, or drop in when a topic is useful." },
  { panel:"right",  x:52, y:72, label:"Contact",
    text:"Instagram @eulingpals · lingpals@eusa.ed.ac.uk · full team details on the LEARN page." }
];

/* ============================================================
   ELEMENTS + STATE
   ============================================================ */
const stage    = document.getElementById("stage");
const scaler   = document.getElementById("scaler");
const brochure = document.getElementById("brochure");
const statusEl = document.getElementById("status");
const dots     = [...document.querySelectorAll(".dot")];
const panels = {
  left:   document.getElementById("panelLeft"),
  center: document.getElementById("panelCenter"),
  right:  document.getElementById("panelRight")
};
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

let stageIndex = 0;
let panelW = 300, panelH = DISPLAY_HEIGHT;

/* ============================================================
   APPLY STAGE  (bug fix: translateZ pushes wings behind cover)
   ============================================================ */
function applyStage(){
  const s = STAGES[stageIndex];

  brochure.style.transform = `rotateX(${s.tilt}deg) rotateY(${s.spin}deg)`;

  // Keep the cover a hair forward so it always occludes the tucked wings
  panels.center.style.transform = `translateZ(2px)`;
  panels.left.style.transform   = `translateZ(${-s.depth}px) rotateY(${ s.wing}deg)`;
  panels.right.style.transform  = `translateZ(${-s.depth}px) rotateY(${-s.wing}deg)`;

  brochure.classList.toggle("is-closed", stageIndex === 0);
  brochure.classList.toggle("is-open",   stageIndex === STAGES.length - 1);

  dots.forEach((d,i)=> d.setAttribute("aria-current", i === stageIndex));
  document.getElementById("foldBtn").disabled   = stageIndex === 0;
  document.getElementById("unfoldBtn").disabled = stageIndex === STAGES.length - 1;

  statusEl.textContent = s.label;
  history.replaceState(null, "", "#stage=" + stageIndex);
  requestFit();
}
function goToStage(i){
  stageIndex = Math.max(0, Math.min(STAGES.length - 1, i));
  applyStage();
}
const unfold = ()=> goToStage(stageIndex + 1);
const fold   = ()=> goToStage(stageIndex - 1);

/* ============================================================
   RESPONSIVE FITTING
   ============================================================ */
function currentFootprint(){
  const t = stageIndex / (STAGES.length - 1);
  const widthPanels = 1 + 2 * t;
  return { w: panelW * widthPanels, h: panelH * 1.22 };
}
function fitToViewport(){
  const { w, h } = currentFootprint();
  const availW = stage.clientWidth  - 16;
  const availH = stage.clientHeight - 16;
  if(availW <= 0 || availH <= 0) return;
  const s = Math.min(1, availW / w, availH / h);
  scaler.style.transform = `scale(${s.toFixed(4)})`;
}
let fitPending = false;
function requestFit(){
  if(fitPending) return;
  fitPending = true;
  requestAnimationFrame(()=>{ fitPending = false; fitToViewport(); });
}
window.addEventListener("resize", requestFit);
window.addEventListener("orientationchange", ()=> setTimeout(requestFit, 250));
if(window.visualViewport) window.visualViewport.addEventListener("resize", requestFit);
if("ResizeObserver" in window) new ResizeObserver(requestFit).observe(stage);

/* ============================================================
   PDF RENDERING + SLICING
   ============================================================ */
async function renderPage(pdf, pageNum){
  const page = await pdf.getPage(pageNum);
  const base = page.getViewport({ scale:1 });
  const scale = (DISPLAY_HEIGHT * RENDER_SCALE) / base.height;
  const viewport = page.getViewport({ scale });
  const c = document.createElement("canvas");
  c.width  = viewport.width; c.height = viewport.height;
  await page.render({ canvasContext:c.getContext("2d"), viewport }).promise;
  return c;
}
function sliceInto(target, source, index){
  const sliceW = source.width / 3;
  target.width  = sliceW; target.height = source.height;
  target.getContext("2d").drawImage(
    source, index*sliceW, 0, sliceW, source.height, 0, 0, sliceW, source.height);
}

/* ------------------------------------------------------------
   PANEL MAPPING

   OUTSIDE page -> FRONT faces.
     The COVER_THIRD is placed on the CENTRE panel so it is what you
     see when the brochure is closed (LingPALS cover). The other two
     thirds go on the side panels (only glimpsed while folding).

   INSIDE page  -> BACK faces, mapped in REVERSE order because the
     whole piece spins 180deg when opened, so the inside spread reads
     left->right correctly and is not mirrored:
       right  panel back -> inside third 0 (appears on the left)
       center panel back -> inside third 1
       left   panel back -> inside third 2 (appears on the right)
   ------------------------------------------------------------ */
async function buildBrochure(pdf){
  if(pdf.numPages < 2)
    statusEl.textContent = "⚠ This PDF needs 2 pages (outside + inside).";

  const outside = await renderPage(pdf, Math.min(OUTSIDE_PAGE, pdf.numPages));
  const inside  = pdf.numPages >= 2 ? await renderPage(pdf, INSIDE_PAGE) : outside;

  panelW = (outside.width / 3) / RENDER_SCALE;
  panelH = outside.height / RENDER_SCALE;
  brochure.style.width  = panelW + "px";
  brochure.style.height = panelH + "px";
  Object.values(panels).forEach(p=>{ p.style.width = panelW+"px"; p.style.height = panelH+"px"; });

  // OUTSIDE -> front faces (cover third goes to centre)
  const others = [0,1,2].filter(i => i !== COVER_THIRD);
  sliceInto(panels.center.querySelector(".front canvas"), outside, COVER_THIRD);
  sliceInto(panels.left  .querySelector(".front canvas"), outside, others[0]);
  sliceInto(panels.right .querySelector(".front canvas"), outside, others[1]);

  // INSIDE -> back faces (reversed)
  sliceInto(panels.left  .querySelector(".back canvas"), inside, 2);
  sliceInto(panels.center.querySelector(".back canvas"), inside, 1);
  sliceInto(panels.right .querySelector(".back canvas"), inside, 0);

  buildHotspots();

  const m = location.hash.match(/stage=(\d)/);
  goToStage(m ? +m[1] : 0);
}

function buildHotspots(){
  document.querySelectorAll(".hotspot").forEach(h=>h.remove());
  HOTSPOTS.forEach((h)=>{
    const face = panels[h.panel].querySelector(".back");
    const btn = document.createElement("button");
    btn.className = "hotspot";
    btn.style.left = h.x + "%"; btn.style.top = h.y + "%";
    btn.setAttribute("aria-expanded","false");
    btn.setAttribute("aria-label", h.label);
    btn.innerHTML = `+<span class="tip" role="tooltip">${h.text}</span>`;
    btn.addEventListener("click",(e)=>{
      e.stopPropagation();
      const open = btn.getAttribute("aria-expanded") === "true";
      document.querySelectorAll(".hotspot").forEach(o=>o.setAttribute("aria-expanded","false"));
      btn.setAttribute("aria-expanded", String(!open));
    });
    face.appendChild(btn);
  });
}

/* ============================================================
   LOADERS
   ============================================================ */
async function loadFromUrl(url){
  try{
    statusEl.textContent = "Loading LingPALS brochure…";
    const pdf = await pdfjsLib.getDocument(url).promise;
    await buildBrochure(pdf);
  }catch(err){
    statusEl.textContent = "Couldn't load assets/brochure.pdf — use “Load another PDF”.";
    console.warn(err);
  }
}
document.getElementById("file").addEventListener("change", async (e)=>{
  const f = e.target.files[0]; if(!f) return;
  const buf = await f.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data:buf }).promise;
  await buildBrochure(pdf);
});

/* ============================================================
   CONTROLS + KEYBOARD + CLICK-TO-OPEN
   ============================================================ */
document.getElementById("unfoldBtn").addEventListener("click", unfold);
document.getElementById("foldBtn").addEventListener("click", fold);
document.getElementById("resetBtn").addEventListener("click", ()=> goToStage(0));
dots.forEach(d=> d.addEventListener("click", ()=> goToStage(+d.dataset.stage)));

brochure.addEventListener("click", (e)=>{
  if(e.target.closest(".hotspot")) return;
  if(stageIndex < STAGES.length - 1) unfold();
});

stage.addEventListener("keydown",(e)=>{
  if(["ArrowRight","ArrowUp"," ","Enter"].includes(e.key)){ e.preventDefault(); unfold(); }
  if(["ArrowLeft","ArrowDown"].includes(e.key)){ e.preventDefault(); fold(); }
});

/* Optional subtle parallax (secondary, off for reduced motion) */
if(!reduceMotion){
  stage.addEventListener("pointermove",(e)=>{
    const r = stage.getBoundingClientRect();
    const dx = (e.clientX - r.left)/r.width  - .5;
    const dy = (e.clientY - r.top )/r.height - .5;
    const s = STAGES[stageIndex];
    brochure.style.transform = `rotateX(${s.tilt - dy*4}deg) rotateY(${s.spin + dx*5}deg)`;
  });
  stage.addEventListener("pointerleave", applyStage);
}

loadFromUrl(PDF_URL);
</script>
</body>
</html>
