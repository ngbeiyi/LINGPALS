<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LingPALS — Join us at the linguist’s table</title>
<meta name="description" content="LingPALS is a peer-led course support programme for Pre-Honours Linguistics and English Language students at Edinburgh. Every Thursday, 4:10–5:00pm.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   LingPALS — pixel-crafted table system
   ============================================================ */
:root{
  --px: 4px;
  --px-small: 2px;
  --pixel-radius: 0px;
  --pixel-shadow: 4px 4px 0 rgba(2, 8, 30, .28);
  --pixel-shadow-lg: 8px 8px 0 rgba(2, 8, 30, .45);

  --midnight:#050B1F;
  --ink-800:#08122E;
  --indigo:#141C4C;
  --royal:#0B4FD6;
  --royal-deep:#0A3FAE;
  --gold:#FFC531;
  --gold-deep:#E5A400;
  --violet:#6757B7;
  --violet-soft:#9C8FE8;
  --cyan:#3BD6E6;

  --paper-cream:#FFF9E8;
  --paper-lav:#EEEAFE;
  --paper-yellow:#FFF0B7;
  --paper-cyan:#E9FBFC;
  --paper-peer:#F0E9FF;
  --ink:#10224B;
  --ink-violet:#6757B7;
  --ink-cyan:#16798A;

  --pixel:'Silkscreen', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --edit:'Space Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

  --ease-paper: cubic-bezier(.62,.04,.30,1);
  --t-fold: 720ms;
  --t-turn: 820ms;

  --panel-w: 240px;
  --panel-h: 360px;
  --fold-left: 180deg;
  --fold-right: 180deg;
  --turn: 0deg;
  --tilt-x: 0deg;
  --tilt-y: 0deg;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--midnight); color:#E8EEFF;
  font-family:var(--edit); font-size:17px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img,canvas{display:block; max-width:100%}
a{color:var(--gold)}
:focus-visible{outline:var(--px) solid var(--gold); outline-offset:var(--px)}

/* ---------- pixel utilities ---------- */
.dither{
  background-image:conic-gradient(rgba(255,255,255,.07) 0 25%, transparent 0 50%, rgba(255,255,255,.07) 0 75%, transparent 0);
  background-size:4px 4px;
}
.notch{ /* stepped 8px corners, no radii anywhere */
  clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),
                    calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px);
}
.eyebrow{
  font-family:var(--pixel); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--cyan);
}
.skip{
  position:absolute; left:8px; top:-64px; z-index:99;
  background:var(--gold); color:var(--midnight); font-family:var(--pixel);
  padding:14px 18px; border:var(--px) solid var(--midnight); text-decoration:none;
  transition:top 120ms linear;
}
.skip:focus{top:8px}

/* ---------- buttons ---------- */
.btn{
  font-family:var(--pixel); font-size:12px; letter-spacing:.08em; text-transform:uppercase;
  min-height:44px; min-width:44px; padding:12px 20px;
  background:var(--indigo); color:#EAF0FF; text-decoration:none;
  border:var(--px) solid #22306B; border-radius:var(--pixel-radius);
  box-shadow:var(--pixel-shadow); cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  transition:transform 120ms steps(2), box-shadow 120ms steps(2), background 120ms linear;
}
.btn:hover{transform:translate(-2px,-2px); box-shadow:6px 6px 0 rgba(2,8,30,.45); background:#1A2559}
.btn:active{transform:translate(2px,2px); box-shadow:2px 2px 0 rgba(2,8,30,.5)}
.btn--gold{background:var(--gold); color:#1A1200; border-color:var(--gold-deep)}
.btn--gold:hover{background:#FFD45C}
.btn--ghost{background:transparent; border-color:#2B3A78}
.btn[aria-disabled="true"]{
  opacity:.4; cursor:not-allowed; box-shadow:none; transform:none;
  background:#0D1638; color:#7F8CBE; border-color:#1A2450;
}
.btn[aria-pressed="true"]{background:var(--violet); border-color:#5344A0; color:#fff}
.btn--arrow{width:56px; height:56px; padding:0; font-size:18px}

/* ============================================================
   HEADER
   ============================================================ */
.site-head{
  position:sticky; top:0; z-index:40;
  background:rgba(5,11,31,.94);
  border-bottom:var(--px) solid var(--royal-deep);
}
.head-in{
  max-width:1360px; margin:0 auto; padding:12px 20px;
  display:flex; align-items:center; gap:20px; flex-wrap:wrap;
}
.brand{display:flex; align-items:baseline; gap:10px; text-decoration:none}
.brand b{font-family:var(--edit); font-weight:700; font-size:26px; color:var(--gold); letter-spacing:-.02em}
.brand span{font-family:var(--pixel); font-size:11px; color:var(--cyan)}
.site-nav{margin-left:auto}
.site-nav ul{display:flex; gap:4px; list-style:none; margin:0; padding:0; flex-wrap:wrap}
.site-nav a{
  font-family:var(--pixel); font-size:11px; letter-spacing:.06em; text-transform:uppercase;
  color:#C9D5FF; text-decoration:none; padding:12px 12px; display:block; min-height:44px;
  display:flex; align-items:center; border:var(--px-small) solid transparent;
}
.site-nav a:hover{color:var(--gold); border-color:#22306B; background:#0B1436}
.site-nav a.is-cta{background:var(--gold); color:#1A1200; border-color:var(--gold-deep)}

/* ============================================================
   HERO
   ============================================================ */
.hero{
  position:relative; padding:56px 20px 20px;
  background:
    radial-gradient(120% 90% at 50% -10%, rgba(11,79,214,.30) 0 30%, rgba(11,79,214,.14) 30% 60%, transparent 60%),
    linear-gradient(180deg,#071031 0%, var(--midnight) 100%);
}
.hero::after{ /* 8px pixel graph paper */
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.3;
  background-image:
    repeating-linear-gradient(90deg, rgba(59,214,230,.10) 0 1px, transparent 1px 8px),
    repeating-linear-gradient(0deg,  rgba(59,214,230,.10) 0 1px, transparent 1px 8px);
  -webkit-mask-image:radial-gradient(80% 70% at 50% 40%, transparent 0 35%, #000 78%);
          mask-image:radial-gradient(80% 70% at 50% 40%, transparent 0 35%, #000 78%);
}
.hero-in{max-width:1000px; margin:0 auto; text-align:center; position:relative; z-index:2}
h1{
  font-size:clamp(34px,6.4vw,68px); line-height:1.02; margin:14px 0 18px;
  font-weight:700; letter-spacing:-.03em; color:#FFFFFF;
  text-shadow:var(--px) var(--px) 0 var(--royal-deep);
}
h1 em{font-style:normal; color:var(--gold)}
.lede{max-width:62ch; margin:0 auto 26px; font-size:clamp(16px,2vw,20px); color:#C6D2F5}
.hero-cta{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:28px}

.when{
  display:inline-flex; flex-wrap:wrap; justify-content:center; align-items:stretch;
  gap:0; margin:0 auto 8px; border:var(--px) solid var(--gold);
  background:#0A1franchise; background:#0A1338; box-shadow:var(--pixel-shadow-lg);
}
.when div{padding:12px 18px; border-right:var(--px-small) solid rgba(255,197,49,.35)}
.when div:last-child{border-right:0}
.when b{display:block; font-family:var(--pixel); font-size:10px; letter-spacing:.12em; color:var(--gold); text-transform:uppercase}
.when span{font-size:15px; color:#EAF0FF}

/* ============================================================
   THE TABLE
   ============================================================ */
.table-section{position:relative; padding:32px 16px 56px; background:linear-gradient(180deg,var(--midnight),#060E26 40%,var(--midnight))}
.table-head{max-width:900px; margin:0 auto 22px; text-align:center}
.table-head h2{font-size:clamp(24px,3.4vw,34px); margin:8px 0 8px; letter-spacing:-.02em}
.table-head p{color:#A9B7E4; margin:0}

.table{
  position:relative; max-width:1440px; margin:0 auto;
  display:grid; grid-template-columns:minmax(190px,1fr) minmax(0,3.1fr) minmax(190px,1fr);
  grid-template-rows:repeat(3,auto); gap:18px; align-items:center;
  padding:26px; border:var(--px) solid #1B2A63; background:var(--ink-800);
  box-shadow:inset 0 0 0 var(--px) #0A1churches; box-shadow:inset 0 0 0 var(--px) #0A1230, var(--pixel-shadow-lg);
}
.table::before{ /* dither + syntax-tree connectors */
  content:""; position:absolute; inset:var(--px); pointer-events:none; opacity:.9;
  background-image:
    conic-gradient(rgba(103,87,183,.10) 0 25%, transparent 0 50%, rgba(103,87,183,.10) 0 75%, transparent 0),
    repeating-linear-gradient(45deg, rgba(59,214,230,.05) 0 2px, transparent 2px 14px);
  background-size:4px 4px, auto;
}
.table::after{ /* peripheral IPA glyph band */
  content:"ŋ  ə  ʔ  ɫ  ʃ  θ  ɪ  ʒ";
  position:absolute; left:0; right:0; bottom:6px; text-align:center;
  font-family:var(--pixel); font-size:13px; letter-spacing:1.2em; color:rgba(59,214,230,.13);
  pointer-events:none;
}

/* ---------- stage ---------- */
.stage-wrap{grid-area:1 / 2 / 4 / 3; position:relative; z-index:3}
.stage{
  position:relative; height:clamp(340px,56vh,620px);
  display:flex; align-items:center; justify-content:center;
  perspective:1500px; perspective-origin:50% 45%;
  border:var(--px) solid var(--royal); background:#060D24;
  box-shadow:inset 0 0 0 var(--px) #030816;
  touch-action:pan-y;
}
.stage::before{ /* stepped warm spotlight */
  content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-radial-gradient(60% 50% at 50% 58%,
      rgba(255,197,49,.10) 0 22%, rgba(255,197,49,.055) 22% 38%,
      rgba(255,197,49,.025) 38% 54%, transparent 54% 100%);
}
.stage.is-inspecting{cursor:grab; touch-action:none}
.stage.is-inspecting:active{cursor:grabbing}

.tilt{transform-style:preserve-3d; transform:rotateX(var(--tilt-x)) rotateY(var(--tilt-y)); transition:transform 220ms var(--ease-paper)}
.tilt.is-dragging{transition:none}

.brochure{
  position:relative; width:var(--panel-w); height:var(--panel-h);
  transform-style:preserve-3d; transform:rotateY(var(--turn));
  transition:transform var(--t-turn) var(--ease-paper), width var(--t-fold) var(--ease-paper), height var(--t-fold) var(--ease-paper);
}
.panel{
  position:absolute; top:0; width:var(--panel-w); height:var(--panel-h);
  transform-style:preserve-3d;
  transition:transform var(--t-fold) var(--ease-paper), width var(--t-fold) var(--ease-paper), height var(--t-fold) var(--ease-paper);
}
.panel--centre{left:0; transform:translateZ(0)}
.panel--left{left:calc(-1 * var(--panel-w)); transform-origin:100% 50%; transform:rotateY(var(--fold-left)) translateZ(2px)}
.panel--right{left:var(--panel-w);          transform-origin:0% 50%;  transform:rotateY(var(--fold-right)) translateZ(4px)}

.face{
  position:absolute; inset:0; overflow:hidden;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  background:#0B1336;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);
}
.face img{width:100%; height:100%; object-fit:cover; image-rendering:auto}
.face--back{transform:rotateY(180deg)}
.face--empty{
  display:flex; align-items:center; justify-content:center; padding:16px; text-align:center;
  font-family:var(--pixel); font-size:11px; color:#7F8CBE; line-height:1.8;
}
.panel--centre .face--front{box-shadow:inset 0 0 0 1px rgba(255,255,255,.14), var(--pixel-shadow-lg)}

/* ---------- controls ---------- */
.controls{
  margin-top:18px; display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap;
}
.progress{
  display:flex; flex-direction:column; align-items:center; gap:6px;
  font-family:var(--pixel); font-size:12px; color:#C9D5FF; min-width:88px;
}
.pips{display:flex; gap:6px}
.pip{width:12px; height:12px; background:#1B2A63; box-shadow:inset 0 0 0 2px #0A1230}
.pip.is-on{background:var(--gold)}
.controls-2{
  margin-top:12px; display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
}
.bridge{
  max-width:60ch; margin:20px auto 0; text-align:center; color:#B6C4EE; font-size:16px;
  border-top:var(--px-small) dashed #22306B; padding-top:16px;
}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============================================================
   PEER NOTES
   ============================================================ */
.scraps{display:contents; list-style:none; margin:0; padding:0}
.scraps > li{position:relative; z-index:2}
.scraps > li:nth-child(1){grid-area:1 / 1}
.scraps > li:nth-child(2){grid-area:2 / 1}
.scraps > li:nth-child(3){grid-area:3 / 1}
.scraps > li:nth-child(4){grid-area:1 / 3}
.scraps > li:nth-child(5){grid-area:2 / 3}
.scraps > li:nth-child(6){grid-area:3 / 3}
.scraps > li:nth-child(1) .scrap{--rot:-6deg}
.scraps > li:nth-child(2) .scrap{--rot: 4deg}
.scraps > li:nth-child(3) .scrap{--rot:-3deg}
.scraps > li:nth-child(4) .scrap{--rot: 7deg}
.scraps > li:nth-child(5) .scrap{--rot:-5deg}
.scraps > li:nth-child(6) .scrap{--rot: 3deg}

.scrap{
  position:relative; display:block; text-decoration:none;
  background:var(--paper, var(--paper-cream)); color:var(--pen, var(--ink));
  padding:16px 14px 14px; min-height:44px;
  border:var(--px-small) solid var(--ink);
  box-shadow:var(--pixel-shadow);
  transform:rotate(var(--rot,0deg));
  transition:transform 140ms steps(3), box-shadow 140ms steps(3), filter 140ms linear;
  filter:saturate(.9) brightness(.96);
}
.scrap::before{ /* pixel tape */
  content:""; position:absolute; top:-10px; left:50%; width:44px; height:16px;
  transform:translateX(-50%) rotate(calc(var(--rot,0deg) * -1.6));
  background:rgba(255,197,49,.55); border:var(--px-small) solid rgba(16,34,75,.35);
}
.scrap::after{ /* dithered paper texture */
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
  background-image:conic-gradient(rgba(16,34,75,.05) 0 25%, transparent 0 50%, rgba(16,34,75,.05) 0 75%, transparent 0);
  background-size:4px 4px;
}
.scrap .sym{
  font-family:var(--pixel); font-size:15px; letter-spacing:.02em; display:block; margin-bottom:8px;
  color:var(--pen, var(--ink));
}
.scrap .prompt{
  font-weight:700; font-size:16px; display:inline; line-height:1.9;
  box-shadow:inset 0 -0.55em 0 var(--marker, rgba(255,197,49,0));
  transition:box-shadow 160ms steps(3);
}
.scrap .desc{
  display:block; margin-top:8px; font-size:14px; line-height:1.45; color:rgba(16,34,75,.82);
  max-height:0; overflow:hidden; opacity:0;
  transition:max-height 200ms var(--ease-paper), opacity 160ms linear, margin 200ms var(--ease-paper);
}
.scrap .role{
  display:block; margin-top:10px; font-family:var(--pixel); font-size:9px;
  letter-spacing:.1em; text-transform:uppercase; color:rgba(16,34,75,.6);
}
.scrap .arrow{
  position:absolute; right:8px; bottom:6px; font-family:var(--pixel); font-size:13px;
  color:var(--pen, var(--ink)); opacity:.55;
}
.scrap:hover, .scrap:focus-visible{
  transform:rotate(var(--rot,0deg)) translate(-2px,-4px);
  box-shadow:var(--pixel-shadow-lg); filter:none;
}
.scrap:hover .desc, .scrap:focus-visible .desc{max-height:8em; opacity:1; margin-top:8px}
.scrap:hover .prompt, .scrap:focus-visible .prompt{--marker:var(--hl, var(--gold))}
.scrap:hover .arrow, .scrap:focus-visible .arrow{opacity:1}

/* paper stocks */
.s-phonetics{--paper:var(--paper-cream); --pen:var(--ink);        --hl:var(--gold)}
.s-syntax   {--paper:var(--paper-cyan);  --pen:var(--ink-cyan);   --hl:#9FE9F2}
.s-morph    {--paper:var(--paper-yellow);--pen:var(--ink);        --hl:#9FE9F2}
.s-pronun   {--paper:var(--paper-lav);   --pen:var(--ink-violet); --hl:var(--gold)}
.s-grammar  {--paper:var(--paper-cream); --pen:var(--ink);        --hl:var(--gold)}
.s-lingpals {--paper:var(--paper-peer);  --pen:var(--ink);        --hl:var(--gold)}

/* ============================================================
   CONTENT SECTIONS
   ============================================================ */
.band{padding:64px 20px; border-top:var(--px) solid #12204F}
.band-in{max-width:1100px; margin:0 auto}
.band h2{font-size:clamp(26px,3.6vw,40px); letter-spacing:-.025em; margin:10px 0 14px}
.band h2 em{font-style:normal; color:var(--gold)}
.band p.intro{color:#B6C4EE; max-width:62ch; margin:0 0 30px}
.grid3{display:grid; gap:18px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{
  background:var(--indigo); border:var(--px) solid #22306B; padding:22px;
  box-shadow:var(--pixel-shadow);
}
.card h3{margin:0 0 8px; font-size:20px; color:#fff}
.card p{margin:0; color:#B6C4EE; font-size:16px}
.card .tag{font-family:var(--pixel); font-size:10px; letter-spacing:.12em; color:var(--cyan); text-transform:uppercase; display:block; margin-bottom:10px}
.checks</nav>
  </div>
</header>

<main id="top">

  <!-- ================= HERO ================= -->
  <section class="hero" aria-labelledby="hero-h">
    <div class="hero-in">
      <p class="eyebrow">Edinburgh University Students’ Association · Course support for Pre-Honours LEL</p>
      <h1 id="hero-h">Join us at the <em>linguist’s table</em>.</h1>
      <p class="lede">
        LingPALS is a peer-led space for language-curious students. Bring a question,
        compare notes, practise tricky ideas and explore how sounds, words and sentences
        work with others. Led entirely by trained student volunteers in LEL.
      </p>

      <div class="when notch">
        <div><b>Every</b><span>Thursday, 4:10 – 5:00pm</span></div>
        <div><b>Where</b><span>Teaching Room 13, Medical School, Teviot Pl EH8 9AG · Doorway 3</span></div>
        <div><b>First session</b><span>24 September — Meet the team &amp; Q&amp;A</span></div>
      </div>

      <div class="hero-cta">
        <a class="btn btn--gold" href="#brochure-stage">Open the leaflet</a>
        <a class="btn btn--ghost" href="#session">What happens in a session</a>
      </div>
    </div>
  </section>

  <!-- ================= THE TABLE ================= -->
  <section class="table-section" id="table" aria-labelledby="table-h">
    <div class="table-head">
      <p class="eyebrow">Pull up a chair</p>
      <h2 id="table-h">The shared linguist’s table</h2>
      <p>The leaflet is in the middle. The notes around it were left by other students. Take one.</p>
    </div>

    <div class="table dither">

      <!-- ---- STAGE ---- -->
      <div class="stage-wrap">
        <div class="stage" id="brochure-stage" tabindex="-1">
          <div class="tilt" id="tilt">
            <div class="brochure" id="brochure" role="img" aria-label="LingPALS Z-fold leaflet, cover. Step 1 of 3.">
              <div class="panel panel--centre" id="p-centre">
                <div class="face face--front" data-face="centre-front"><div class="face--empty">Loading leaflet…</div></div>
                <div class="face face--back"  data-face="centre-back"></div>
              </div>
              <div class="panel panel--left" id="p-left">
                <div class="face face--front" data-face="left-front"></div>
                <div class="face face--back"  data-face="left-back"></div>
              </div>
              <div class="panel panel--right" id="p-right">
                <div class="face face--front" data-face="right-front"></div>
                <div class="face face--back"  data-face="right-back"></div>
              </div>
            </div>
          </div>
        </div>

        <nav class="controls" aria-label="Leaflet navigation">
          <button class="btn btn--arrow" id="prev" type="button" aria-label="Previous leaflet step">◀</button>
          <p class="progress" aria-hidden="true">
            <span id="counter">01 / 03</span>
            <span class="pips"><i class="pip is-on"></i><i class="pip"></i><i class="pip"></i></span>
          </p>
          <button class="btn btn--arrow" id="next" type="button" aria-label="Next leaflet step">▶</button>
        </nav>

        <div class="controls-2">
          <button class="btn" id="restart" type="button">Restart</button>
          <button class="btn rm-hide" id="inspect" type="button" aria-pressed="false">Inspect in 3D</button>
          <button class="btn rm-hide" id="resetAngle" type="button" aria-disabled="true">Reset angle</button>
        </div>

        <p class="sr" id="live" role="status" aria-live="polite">Brochure cover. Step 1 of 3.</p>

        <p class="bridge">
          This table is a starting point. Open the leaflet for practical details,
          explore a resource, then bring your questions and examples to a LingPALS session.
        </p>
      </div>

      <!-- ---- PEER NOTES ---- -->
      <ul class="scraps" role="list" id="resources" aria-label="Peer notes and Linguistics resource pathways">
        <li>
          <!-- TODO: replace # with your IPA / speech-sounds resource URL -->
          <a class="scrap s-phonetics notch" href="#">
            <span class="sym">/ŋ/</span>
            <span class="prompt">Try it aloud?</span>
            <span class="desc">Can you find it in a word you know?</span>
            <span class="role">Phonetics · IPA &amp; speech sounds</span>
            <span class="arrow" aria-hidden="true">→</span>
          </a>
        </li>
        <li>
          <!-- TODO: replace # with your phrase-structure resource URL -->
          <a class="scrap s-syntax notch" href="#">
            <span class="sym">NP → Det N</span>

  <p style="padding:20px;color:#FFF">The interactive leaflet needs JavaScript. You can
  <a href="assets/brochure.pdf">download the LingPALS leaflet (PDF)</a> instead.
  Sessions run every Thursday, 4:10–5:00pm, Teaching Room 13, Medical School, Teviot Pl EH8 9AG.</p>
</noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
  "use strict";

  /* ========== CONFIG (editable) ========== */
  const PDF_URL      = "assets/brochure.pdf";
  const OUTSIDE_PAGE = 1;   // exterior
  const INSIDE_PAGE  = 2;   // interior
  const COVER_THIRD  = 2;   // right-hand third of page 1 is the cover

  const PANEL_MAP = {
    left:   { front:[OUTSIDE_PAGE, 0], back:[INSIDE_PAGE, 2] },
    centre: { front:[OUTSIDE_PAGE, COVER_THIRD], back:[INSIDE_PAGE, 1] },
    right:  { front:[OUTSIDE_PAGE, 1], back:[INSIDE_PAGE, 0] }
  };

  /* Mirrored hinges + identical signs = true Z-fold (left sweeps toward the
     viewer, right sweeps away). Set right:-1 for tri-fold behaviour. */
  const FOLD = { left:+1, right:+1 };

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  /* ========== DOM ========== */
  const root   = document.documentElement;
  const stage  = document.getElementById('brochure-stage');
  const tilt   = document.getElementById('tilt');
  const broch  = document.getElementById('brochure');
  const pLeft  = document.getElementById('p-left');
  const pRight = document.getElementById('p-right');
  const prevB  = document.getElementById('prev');
  const nextB  = document.getElementById('next');
  const restart= document.getElementById('restart');
  const inspectB = document.getElementById('inspect');
  const resetB   = document.getElementById('resetAngle');
  const counter  = document.getElementById('counter');
  const pips     = Array.from(document.querySelectorAll('.pip'));
  const live     = document.getElementById('live');
  const fileIn   = document.getElementById('pdfInput');
  const status   = document.getElementById('pdfStatus');

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ========== STATE ========== */
  let state = 1;                       // 1 cover · 2 exterior · 3 interior
  let aspect = 240/360;                // panel w/h, replaced after render
  let inspecting = false;
  let dragging = false, sx=0, sy=0, ry=0, rx=0, ry0=0, rx0=0;

  const LABELS = {
    1:"Brochure cover. Step 1 of 3.",
    2:"Exterior spread. Step 2 of 3.",
    3:"Interior spread. Step 3 of 3."
  };

  /* ========== PDF → PANEL FACES ========== */
  async function loadPDF(src){
    setEmpty("Loading leaflet…");
    try{
      const task = (typeof src === "string")
        ? pdfjsLib.getDocument(src)
        : pdfjsLib.getDocument({ data:src });
      const pdf = await task.promise;
      const pages = {};
      for (const n of [OUTSIDE_PAGE, INSIDE_PAGE]){
        if (n <= pdf.numPages) pages[n] = await renderThirds(pdf, n);
      }
      applyFaces(pages);
      status.textContent = (typeof src === "string") ? src : "local preview";
    }catch(err){
      console.warn("[LingPALS] PDF unavailable:", err);
      setEmpty("Leaflet artwork not found.\nAdd assets/brochure.pdf\nor use the developer preview.");
    }
    fit(true);
  }

  async function renderThirds(pdf, pageNo){
    const page = await pdf.getPage(pageNo);
    const base = page.getViewport({ scale:1 });
    const scale = Math.min(3, 2400 / base.width);
    const vp = page.getViewport({ scale });
    const c = document.createElement('canvas');
    c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
    await page.render({ canvasContext:c.getContext('2d', {alpha:false}), viewport:vp }).promise;

    aspect = (c.width/3) / c.height;

    const out = [];
    const tw = Math.floor(c.width/3);
    for (let i=0;i<3;i++){
      const t = document.createElement('canvas');
      t.width = tw; t.height = c.height;
      t.getContext('2d').drawImage(c, i*tw, 0, tw, c.height, 0, 0, tw, c.height);
      out.push(t.toDataURL('image/png'));
    }
    return out;
  }

  function applyFaces(pages){
    Object.keys(PANEL_MAP).forEach(function(panel){
      ['front','back'].forEach(function(side){
        const [pg, third] = PANEL_MAP[panel][side];
        const el = document.querySelector('[data-face="'+panel+'-'+side+'"]');
        if (!el) return;
        const src = pages[pg] && pages[pg][third];
        el.innerHTML = '';
        el.classList.remove('face--empty');
        if (src){
          const img = new Image();
          img.alt = '';
          img.src = src;
          el.appendChild(img);
        }
      });
    });
  }

  function setEmpty(msg){
    const centre = document.querySelector('[data-face="centre-front"]');
    centre.classList.add('face--empty');
    centre.textContent = msg;
  }

  /* ========== FOLD / TURN ========== */
  function render(){
    const angle = (state === 1) ? 180 : 0;
    pLeft.style.transform  = 'rotateY('+(FOLD.left  * angle)+'deg) translateZ(2px)';
    pRight.style.transform = 'rotateY('+(FOLD.right * angle)+'deg) translateZ(4px)';
    broch.style.transform  = 'rotateY('+((state === 3) ? 180 : 0)+'deg)';

    counter.textContent = '0'+state+' / 03';
    pips.forEach(function(p,i){ p.classList.toggle('is-on', i < state); });

    setDisabled(prevB, state === 1);
    setDisabled(nextB, state === 3);

    broch.setAttribute('aria-label', 'LingPALS Z-fold leaflet. ' + LABELS[state]);
    live.textContent = LABELS[state];

    fit();
  }

  function setDisabled(btn, off){
    btn.setAttribute('aria-disabled', off ? 'true' : 'false');
    btn.tabIndex = 0; /* stays focusable — never trap or hide */
  }

  function go(n){
    const next = Math.min(3, Math.max(1, n));
    if (next === state) return;
    state = next;
    render();
  }

  /* ========== DYNAMIC FIT ========== */
  let rafId = null;
  function fit(force){
    if (rafId && !force) return;
    rafId = requestAnimationFrame(function(){
      rafId = null;
      const panels = (state === 1) ? 1 : 3;
      const gutter = window.innerWidth < 700 ? 24 : 64;
      const availW = Math.max(120, stage.clientWidth  - gutter);
      const availH = Math.max(160, stage.clientHeight - gutter);
      let w = availW / panels;
      let h = w / aspect;
      if (h > availH){ h = availH; w = h * aspect; }
      root.style.setProperty('--panel-w', Math.round(w)+'px');
      root.style.setProperty('--panel-h', Math.round(h)+'px');
    });
  }

  /* ========== CONTROLS ========== */
  prevB.addEventListener('click', function(){ if (prevB.getAttribute('aria-disabled')!=='true') go(state-1); });
  nextB.addEventListener('click', function(){ if (nextB.getAttribute('aria-disabled')!=='true') go(state+1); });
  restart.addEventListener('click', function(){ go(1); resetAngle(); stage.focus(); });

  document.addEventListener('keydown', function(e){
    if (e.target.closest('a, button, input, textarea, select, [contenteditable]')) return;
    const nextKeys = ['ArrowRight','ArrowDown',' ','Spacebar','Enter'];
    const prevKeys = ['ArrowLeft','ArrowUp'];
    if (nextKeys.indexOf(e.key) > -1){ e.preventDefault(); go(state+1); }
    else if (prevKeys.indexOf(e.key) > -1){ e.preventDefault(); go(state-1); }
  });

  /* ========== 3D INSPECTION ========== */
  function resetAngle(){
    rx = 0; ry = 0;
    root.style.setProperty('--tilt-x','0deg');
    root.style.setProperty('--tilt-y','0deg');
    resetB.setAttribute('aria-disabled','true');
  }

  if (reduce){
    inspectB.remove(); resetB.remove();
  } else {
    inspectB.addEventListener('click', function(){
      inspecting = !inspecting;
      inspectB.setAttribute('aria-pressed', String(inspecting));
      stage.classList.toggle('is-inspecting', inspecting);
      if (!inspecting) resetAngle();
      live.textContent = inspecting
        ? '3D inspection on. Drag the leaflet to tilt it.'
        : '3D inspection off. ' + LABELS[state];
    });
    resetB.addEventListener('click', function(){ resetAngle(); live.textContent='Angle reset. '+LABELS[state]; });

    stage.addEventListener('pointerdown', function(e){
      if (!inspecting) return;
      dragging = true; tilt.classList.add('is-dragging');
      sx = e.clientX; sy = e.clientY; rx0 = rx; ry0 = ry;
      stage.setPointerCapture(e.pointerId);
    });
    stage.addEventListener('pointermove', function(e){
      if (!dragging) return;
      e.preventDefault();
      ry = clamp(ry0 + (e.clientX - sx) * 0.22, -30, 30);
      rx = clamp(rx0 - (e.clientY - sy) * 0.18, -20, 20);
      root.style.setProperty('--tilt-y', ry.toFixed(2)+'deg');
      root.style.setProperty('--tilt-x', rx.toFixed(2)+'deg');
      resetB.setAttribute('aria-disabled','false');
    });
    ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
      stage.addEventListener(ev, function(){ dragging=false; tilt.classList.remove('is-dragging'); });
    });
  }
  function clamp(v,a,b){ return Math.min(b, Math.max(a, v)); }

  /* ========== DEV PDF PREVIEW ========== */
  fileIn.addEventListener('change', function(){
    const f = fileIn.files && fileIn.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = function(){ loadPDF(new Uint8Array(r.result)); };
    r.readAsArrayBuffer(f);
  });

  /* ========== RE-FIT TRIGGERS ========== */
  window.addEventListener('resize', function(){ fit(); });
  window.addEventListener('orientationchange', function(){ setTimeout(fit, 220); });
  if (window.visualViewport){
    window.visualViewport.addEventListener('resize', function(){ fit(); });
  }
  if ('ResizeObserver' in window){
    new ResizeObserver(function(){ fit(); }).observe(stage);
  }

  /* ========== BOOT ========== */
  render();
  loadPDF(PDF_URL);
})();
</script>
