<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Unfold — Interactive Z-Fold Brochure</title>

<!-- PDF.js (CDN — works on GitHub Pages) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
  :root{
    /* Warm "paper on a wooden reading desk" palette */
    --desk-1:#e8d3af;
    --desk-2:#c99f6d;
    --desk-3:#8a5a34;
    --ink:#2b2118;
    --accent:#b5462d;         /* terracotta */
    --accent-ink:#fff7ef;
    --paper:#fffdf8;
    --paper-edge:#e7ddca;
    --focus:#1c6e8c;
    --paper-shadow: 0 26px 55px rgba(58,36,15,.45);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }

  body{
    margin:0;
    min-height:100dvh;                 /* copes with mobile browser chrome */
    font-family:"Segoe UI", system-ui, sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-x:hidden;
    /* Layered desk surface: warm light + wood + soft grain */
    background:
      radial-gradient(120% 90% at 50% -10%, rgba(255,251,240,.85), rgba(255,251,240,0) 55%),
      radial-gradient(80% 60% at 50% 120%, rgba(70,40,16,.35), rgba(70,40,16,0) 60%),
      repeating-linear-gradient(92deg, rgba(120,80,40,.05) 0 3px, rgba(120,80,40,0) 3px 7px),
      linear-gradient(160deg, var(--desk-1), var(--desk-2) 55%, var(--desk-3));
    background-attachment:fixed;
  }

  header{
    text-align:center;
    padding:clamp(16px,4vw,30px) 18px 4px;
    max-width:760px;
  }
  header h1{
    margin:0;
    font-size:clamp(1.5rem,3.6vw,2.3rem);
    font-weight:700;
    letter-spacing:.3px;
  }
  header p{ margin:8px 0 0; color:#5a4327; font-size:.95rem; }

  /* ---------- STAGE ---------- */
  .stage{
    flex:1 1 auto;
    width:100%;
    min-height:clamp(280px, 48dvh, 620px);  /* never collapses */
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(6px,2vw,16px);
    overflow:hidden;                         /* nothing spills off small screens */
  }

  /* Scaler holds perspective and fits the piece to the viewport */
  .brochure-scaler{
    perspective:2400px;
    transform-origin:center center;
    transition:transform .5s ease;
    will-change:transform;
  }

  .brochure{
    position:relative;
    transform-style:preserve-3d;
    transition:transform .8s cubic-bezier(.62,.04,.3,1);
  }
  .brochure::before{ /* soft shadow on the desk beneath the paper */
    content:"";
    position:absolute;
    left:-40%; right:-40%; bottom:-14%;
    height:40px;
    background:radial-gradient(closest-side, rgba(58,36,15,.5), rgba(58,36,15,0));
    transform:translateZ(-60px);
    filter:blur(6px);
    pointer-events:none;
  }

  .panel{
    position:absolute;
    top:0;
    transform-style:preserve-3d;
    transition:transform .8s cubic-bezier(.62,.04,.3,1);
  }
  .panel.center{ left:0; }
  .panel.left  { right:100%; transform-origin:right center; }
  .panel.right { left:100%;  transform-origin:left center; }

  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    overflow:hidden;
    background:var(--paper);
    box-shadow:var(--paper-shadow);
    border:1px solid var(--paper-edge);
  }
  .face.back{ transform:rotateY(180deg); }
  .face canvas{ display:block; width:100%; height:100%; }

  /* Crease + gutter shading so folds read as paper */
  .face::after{
    content:"";
    position:absolute; inset:0;
    pointer-events:none;
    background:linear-gradient(90deg,
      rgba(43,33,24,.14), rgba(43,33,24,0) 10%,
      rgba(43,33,24,0) 90%, rgba(43,33,24,.14));
  }

  /* Cover cue that invites the first unfold */
  .brochure.is-closed .panel.center .face.front{ cursor:pointer; }
  .cover-cue{
    position:absolute;
    left:50%; bottom:14px;
    transform:translateX(-50%);
    background:rgba(43,33,24,.72);
    color:#fff;
    font-size:.72rem;
    letter-spacing:.4px;
    padding:6px 12px;
    border-radius:999px;
    pointer-events:none;
    opacity:0;
    transition:opacity .4s ease;
    z-index:5;
  }
  .brochure.is-closed .cover-cue{ opacity:1; animation:bob 2.2s ease-in-out infinite; }
  @keyframes bob{ 50%{ transform:translateX(-50%) translateY(-4px);} }

  /* ---------- HOTSPOTS (optional interaction #1) ---------- */
  .hotspot{
    position:absolute;
    width:30px; height:30px;
    margin:-15px 0 0 -15px;
    border-radius:50%;
    border:none;
    background:var(--accent);
    color:var(--accent-ink);
    font-weight:700;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(43,33,24,.4);
    opacity:0; pointer-events:none;
    transition:opacity .4s ease, transform .2s ease;
    z-index:6;
  }
  .brochure.is-open .hotspot{ opacity:1; pointer-events:auto; }
  .hotspot::before{ /* pulse ring */
    content:""; position:absolute; inset:-6px; border-radius:50%;
    border:2px solid var(--accent);
    animation:pulse 2s ease-out infinite;
  }
  @keyframes pulse{ to{ transform:scale(1.9); opacity:0; } }
  .hotspot:hover, .hotspot:focus-visible{ transform:scale(1.15); }
  .hotspot .tip{
    position:absolute;
    left:50%; bottom:140%;
    transform:translateX(-50%) scale(.9);
    transform-origin:bottom center;
    width:170px;
    background:var(--paper);
    color:var(--ink);
    border:1px solid var(--paper-edge);
    border-radius:10px;
    padding:9px 11px;
    font-size:.75rem;
    line-height:1.35;
    font-weight:500;
    box-shadow:0 10px 24px rgba(43,33,24,.35);
    opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  .hotspot[aria-expanded="true"] .tip{ opacity:1; transform:translateX(-50%) scale(1); }

  /* ---------- CONTROLS ---------- */
  .controls{
    width:min(720px, 94vw);
    background:rgba(255,253,248,.82);
    border:1px solid rgba(43,33,24,.12);
    backdrop-filter:blur(6px);
    border-radius:18px;
    padding:16px 20px;
    margin:8px 0 30px;
    display:grid;
    gap:14px;
    box-shadow:0 12px 30px rgba(58,36,15,.22);
  }
  .row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center; }

  button, .filebtn{
    font-family:inherit;
    background:var(--accent);
    color:var(--accent-ink);
    border:2px solid transparent;
    font-weight:600;
    padding:11px 18px;
    border-radius:12px;
    cursor:pointer;
    font-size:.9rem;
    transition:transform .1s, filter .15s;
  }
  button:hover, .filebtn:hover{ filter:brightness(1.06); }
  button:active{ transform:translateY(1px); }
  button[disabled]{ opacity:.4; cursor:not-allowed; }
  .ghost{ background:transparent; color:#5a4327; border:2px solid rgba(43,33,24,.25); }

  /* Progress indicator (optional interaction #2) */
  .progress{ display:flex; gap:10px; align-items:center; }
  .dot{
    width:34px; height:10px; border-radius:999px;
    border:none; padding:0; cursor:pointer;
    background:rgba(43,33,24,.2);
    transition:background .3s ease, transform .2s ease;
  }
  .dot[aria-current="true"]{ background:var(--accent); transform:scaleY(1.3); }

  .filebtn input{ display:none; }
  .status{ font-size:.82rem; color:#6b512f; text-align:center; min-height:1em; }

  a:focus-visible, button:focus-visible, .filebtn:focus-visible,
  .hotspot:focus-visible, .stage:focus-visible{
    outline:3px solid var(--focus);
    outline-offset:2px;
    border-radius:8px;
  }

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  /* ---------- RESPONSIVE ERGONOMICS ---------- */

  /* Larger, thumb-friendly hit areas on touch screens */
  @media (pointer:coarse){
    button, .filebtn{ padding:13px 18px; }
    .hotspot{ width:38px; height:38px; margin:-19px 0 0 -19px; }
  }

  /* Phones: stack controls, let buttons grow */
  @media (max-width:560px){
    header p{ font-size:.86rem; }
    .controls{ padding:14px; gap:12px; margin-bottom:20px; }
    .row{ gap:10px; }
    #unfoldBtn, #foldBtn, #resetBtn, .filebtn{ flex:1 1 44%; text-align:center; }
    .progress{ order:-1; width:100%; justify-content:center; }
    .dot{ width:44px; height:12px; }
  }

  /* Short landscape phones: reclaim vertical space */
  @media (max-height:520px) and (orientation:landscape){
    header{ padding:8px 18px 0; }
    header p{ display:none; }
    .stage{ min-height:60dvh; }
    .controls{ margin:4px 0 12px; }
  }

  /* Reduce perspective distortion on narrow screens */
  @media (max-width:700px){ .brochure-scaler{ perspective:1500px; } }

  /* ---------- Reduced motion ---------- */
  @media (prefers-reduced-motion: reduce){
    .brochure, .panel, .brochure-scaler{ transition-duration:.001ms !important; }
    .hotspot::before, .brochure.is-closed .cover-cue{ animation:none !important; }
  }
</style>
</head>
<body>

<header>
  <h1>Unfold the Brochure</h1>
  <p>It starts closed on the desk. Tap the cover — or use the buttons — to open each fold and discover the inside.</p>
</header>

<main class="stage" id="stage" tabindex="0"
      aria-label="Interactive z-fold brochure. Use the Unfold and Fold buttons, or arrow keys, to open and close it.">
  <div class="brochure-scaler" id="scaler">
    <div class="brochure is-closed" id="brochure">

      <span class="cover-cue" aria-hidden="true">Tap to open ›</span>

      <!-- LEFT panel -->
      <div class="panel left" id="panelLeft">
        <div class="face front"><canvas></canvas></div>
        <div class="face back"><canvas></canvas></div>
      </div>

      <!-- CENTER panel (front cover when closed) -->
      <div class="panel center" id="panelCenter">
        <div class="face front"><canvas></canvas></div>
        <div class="face back"><canvas></canvas></div>
      </div>

      <!-- RIGHT panel -->
      <div class="panel right" id="panelRight">
        <div class="face front"><canvas></canvas></div>
        <div class="face back"><canvas></canvas></div>
      </div>

    </div>
  </div>
</main>

<div class="controls">
  <div class="row">
    <button id="foldBtn" class="ghost" aria-label="Fold one panel back">‹ Fold</button>

    <div class="progress" role="group" aria-label="Unfolding progress">
      <button class="dot" data-stage="0" aria-label="Closed" aria-current="true"></button>
      <button class="dot" data-stage="1" aria-label="Half open"></button>
      <button class="dot" data-stage="2" aria-label="Fully open"></button>
    </div>

    <button id="unfoldBtn" aria-label="Unfold one panel">Unfold ›</button>
  </div>

  <div class="row">
    <button id="resetBtn" class="ghost">Start again</button>
    <label class="filebtn">Load another PDF
      <input type="file" id="file" accept="application/pdf">
    </label>
  </div>

  <p class="status" id="status" role="status" aria-live="polite">Loading brochure…</p>
</div>

<script>
/* ============================================================
   PDF.js worker (CDN — works on GitHub Pages)
   ============================================================ */
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

/* ------------------------------------------------------------
   CONFIG — relative path works locally AND on GitHub Pages
   ------------------------------------------------------------ */
const PDF_URL        = "assets/brochure.pdf";
const DISPLAY_HEIGHT = 460;   // logical panel height (px)
const RENDER_SCALE   = 2;     // super-sampling for crisp panels

/* Unfolding stages.
   wing = fold angle of each side panel (deg)
   spin = whole-piece rotation (0 = exterior faces you, 180 = interior faces you)
   tilt = gentle 3D tilt (rotateX)                                            */
const STAGES = [
  { wing:155, spin:0,   tilt:-14, label:"Closed — front cover" }, // page 1 outside
  { wing:78,  spin:90,  tilt:-7,  label:"Half open — turning" },
  { wing:0,   spin:180, tilt:0,   label:"Open — inside spread" }  // page 2 inside
];

/* Optional hotspots on the INTERIOR (page 2). Positioned as % of a panel. */
const HOTSPOTS = [
  { panel:"center", x:50, y:34, label:"Key info", text:"Open days run every Wednesday — book your place online." },
  { panel:"right",  x:45, y:60, label:"Find us",  text:"Central campus, 5 minutes from the station." },
  { panel:"left",   x:55, y:44, label:"Contact",  text:"Questions? Email study@university.example." }
];

/* ============================================================
   ELEMENTS + STATE
   ============================================================ */
const stage    = document.getElementById("stage");
const scaler   = document.getElementById("scaler");
const brochure = document.getElementById("brochure");
const statusEl = document.getElementById("status");
const dots     = [...document.querySelectorAll(".dot")];

const panels = {
  left:   document.getElementById("panelLeft"),
  center: document.getElementById("panelCenter"),
  right:  document.getElementById("panelRight")
};

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

let stageIndex = 0;
let panelW = 300, panelH = DISPLAY_HEIGHT;   // set after render

/* ============================================================
   APPLY THE CURRENT STAGE
   ============================================================ */
function applyStage(){
  const s = STAGES[stageIndex];

  brochure.style.transform = `rotateX(${s.tilt}deg) rotateY(${s.spin}deg)`;
  panels.left.style.transform  = `rotateY(${ s.wing}deg)`;
  panels.right.style.transform = `rotateY(${-s.wing}deg)`;

  brochure.classList.toggle("is-closed", stageIndex === 0);
  brochure.classList.toggle("is-open",   stageIndex === STAGES.length - 1);

  dots.forEach((d,i)=> d.setAttribute("aria-current", i === stageIndex));
  document.getElementById("foldBtn").disabled   = stageIndex === 0;
  document.getElementById("unfoldBtn").disabled = stageIndex === STAGES.length - 1;

  statusEl.textContent = s.label;
  history.replaceState(null, "", "#stage=" + stageIndex);  // shareable state (#3)
  requestFit();
}

function goToStage(i){
  stageIndex = Math.max(0, Math.min(STAGES.length - 1, i));
  applyStage();
}
const unfold = ()=> goToStage(stageIndex + 1);
const fold   = ()=> goToStage(stageIndex - 1);

/* ============================================================
   RESPONSIVE FITTING
   Scales the piece to the stage box for its CURRENT footprint
   (closed ≈ 1 panel wide, open ≈ 3 panels wide), so it frames
   correctly on mobile, tablet and laptop, portrait or landscape.
   ============================================================ */
function currentFootprint(){
  const t = stageIndex / (STAGES.length - 1);  // openness 0..1
  const widthPanels = 1 + 2 * t;               // 1 (closed) → 3 (open)
  return { w: panelW * widthPanels, h: panelH * 1.22 };
}

function fitToViewport(){
  const { w, h } = currentFootprint();
  const availW = stage.clientWidth  - 16;
  const availH = stage.clientHeight - 16;
  if(availW <= 0 || availH <= 0) return;
  const s = Math.min(1, availW / w, availH / h);
  scaler.style.transform = `scale(${s.toFixed(4)})`;
}

/* Debounced with rAF so rapid resize / URL-bar show-hide stays smooth */
let fitPending = false;
function requestFit(){
  if(fitPending) return;
  fitPending = true;
  requestAnimationFrame(()=>{ fitPending = false; fitToViewport(); });
}

window.addEventListener("resize", requestFit);
window.addEventListener("orientationchange", ()=> setTimeout(requestFit, 250));
if(window.visualViewport) window.visualViewport.addEventListener("resize", requestFit);
if("ResizeObserver" in window) new ResizeObserver(requestFit).observe(stage);

/* ============================================================
   PDF RENDERING + PANEL SLICING
   ============================================================ */
async function renderPage(pdf, pageNum){
  const page = await pdf.getPage(pageNum);
  const base = page.getViewport({ scale:1 });
  const scale = (DISPLAY_HEIGHT * RENDER_SCALE) / base.height;
  const viewport = page.getViewport({ scale });

  const c = document.createElement("canvas");
  c.width  = viewport.width;
  c.height = viewport.height;
  await page.render({ canvasContext:c.getContext("2d"), viewport }).promise;
  return c;
}

function sliceInto(target, source, index){
  const sliceW = source.width / 3;
  target.width  = sliceW;
  target.height = source.height;
  target.getContext("2d").drawImage(
    source, index*sliceW, 0, sliceW, source.height,
            0, 0, sliceW, source.height);
}

/* ------------------------------------------------------------
   PANEL MAPPING  (the key correction)

   PDF PAGE 1 = EXTERIOR (front faces). Thirds left→right 0,1,2:
     third 0 -> left  panel front
     third 1 -> center panel front  <-- shown when CLOSED = FRONT COVER
     third 2 -> right panel front

   PDF PAGE 2 = INTERIOR (back faces). When fully open the whole
   piece spins 180deg, so the left/right panels swap on screen. To
   keep the inside spread reading left→right as page-2 thirds 0,1,2,
   the back faces are mapped in REVERSE order:
     right  panel back -> page2 third 0 (appears on the left)
     center panel back -> page2 third 1
     left   panel back -> page2 third 2 (appears on the right)
   (Each back face is itself rotateY(180deg); combined with the
   180deg piece spin, artwork is NOT mirrored — it reads normally.)
   ------------------------------------------------------------ */
async function buildBrochure(pdf){
  if(pdf.numPages < 2)
    statusEl.textContent = "⚠ This PDF needs 2 pages (page 1 = outside, page 2 = inside).";

  const outside = await renderPage(pdf, 1);                    // EXTERIOR
  const inside  = pdf.numPages >= 2 ? await renderPage(pdf, 2) // INTERIOR
                                    : outside;

  panelW = (outside.width / 3) / RENDER_SCALE;
  panelH = outside.height / RENDER_SCALE;
  brochure.style.width  = panelW + "px";
  brochure.style.height = panelH + "px";
  Object.values(panels).forEach(p=>{
    p.style.width  = panelW + "px";
    p.style.height = panelH + "px";
  });

  // Exterior (page 1) -> FRONT faces
  sliceInto(panels.left  .querySelector(".front canvas"), outside, 0);
  sliceInto(panels.center.querySelector(".front canvas"), outside, 1);
  sliceInto(panels.right .querySelector(".front canvas"), outside, 2);

  // Interior (page 2) -> BACK faces, reversed (see note above)
  sliceInto(panels.left  .querySelector(".back canvas"), inside, 2);
  sliceInto(panels.center.querySelector(".back canvas"), inside, 1);
  sliceInto(panels.right .querySelector(".back canvas"), inside, 0);

  buildHotspots();

  // Honour a shared #stage= link, otherwise start CLOSED.
  const m = location.hash.match(/stage=(\d)/);
  goToStage(m ? +m[1] : 0);
}

/* Build interior hotspots into the correct back faces */
function buildHotspots(){
  document.querySelectorAll(".hotspot").forEach(h=>h.remove());
  HOTSPOTS.forEach((h)=>{
    const face = panels[h.panel].querySelector(".back");
    const btn = document.createElement("button");
    btn.className = "hotspot";
    btn.style.left = h.x + "%";
    btn.style.top  = h.y + "%";
    btn.setAttribute("aria-expanded","false");
    btn.setAttribute("aria-label", h.label);
    btn.innerHTML = `+<span class="tip" role="tooltip">${h.text}</span>`;
    btn.addEventListener("click",(e)=>{
      e.stopPropagation();
      const open = btn.getAttribute("aria-expanded") === "true";
      document.querySelectorAll(".hotspot").forEach(o=>o.setAttribute("aria-expanded","false"));
      btn.setAttribute("aria-expanded", String(!open));
    });
    face.appendChild(btn);
  });
}

/* ============================================================
   LOADERS
   ============================================================ */
async function loadFromUrl(url){
  try{
    statusEl.textContent = "Loading brochure…";
    const pdf = await pdfjsLib.getDocument(url).promise;
    await buildBrochure(pdf);
  }catch(err){
    statusEl.textContent = "Couldn't load assets/brochure.pdf — use “Load another PDF”.";
    console.warn(err);
  }
}

document.getElementById("file").addEventListener("change", async (e)=>{
  const f = e.target.files[0]; if(!f) return;
  const buf = await f.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data:buf }).promise;
  await buildBrochure(pdf);
});

/* ============================================================
   CONTROLS + KEYBOARD + CLICK-TO-OPEN
   ============================================================ */
document.getElementById("unfoldBtn").addEventListener("click", unfold);
document.getElementById("foldBtn").addEventListener("click", fold);
document.getElementById("resetBtn").addEventListener("click", ()=> goToStage(0));
dots.forEach(d=> d.addEventListener("click", ()=> goToStage(+d.dataset.stage)));

// Tap the cover (or anywhere on the closed piece) to begin unfolding
brochure.addEventListener("click", (e)=>{
  if(e.target.closest(".hotspot")) return;
  if(stageIndex < STAGES.length - 1) unfold();
});

// Keyboard: arrows / space / enter drive the unfolding
stage.addEventListener("keydown",(e)=>{
  if(["ArrowRight","ArrowUp"," ","Enter"].includes(e.key)){ e.preventDefault(); unfold(); }
  if(["ArrowLeft","ArrowDown"].includes(e.key)){ e.preventDefault(); fold(); }
});

/* ---------- OPTIONAL secondary "inspect" parallax ----------
   Very subtle, off for reduced motion. Never the primary action. */
if(!reduceMotion){
  stage.addEventListener("pointermove",(e)=>{
    const r = stage.getBoundingClientRect();
    const dx = (e.clientX - r.left)/r.width  - .5;
    const dy = (e.clientY - r.top )/r.height - .5;
    const s = STAGES[stageIndex];
    brochure.style.transform =
      `rotateX(${s.tilt - dy*5}deg) rotateY(${s.spin + dx*6}deg)`;
  });
  stage.addEventListener("pointerleave", applyStage);
}

/* Kick things off */
loadFromUrl(PDF_URL);
</script>
</body>
</html>
